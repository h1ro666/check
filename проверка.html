<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Проверка безопасности</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* Запрещаем выделение текста и стандартное меню телефона */
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent; /* Убираем серую подсветку при тапе */
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            min-height: 100vh;
            height: 100dvh; /* Правильная высота для iOS/Android */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            touch-action: none; /* Блокируем скролл и зум пальцами */
        }

        /* === ЦВЕТОЧКИ ПО УГЛАМ === */
        .flower-corner {
            position: fixed;
            font-size: 60px;
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
            filter: grayscale(20%);
            animation: sway 6s ease-in-out infinite;
        }

        .flower-corner.tl { top: 20px; left: 20px; animation-delay: 0s; }
        .flower-corner.tr { top: 20px; right: 20px; transform: scaleX(-1); animation-delay: 1.5s; }
        .flower-corner.bl { bottom: 20px; left: 20px; transform: scaleY(-1); animation-delay: 3s; }
        .flower-corner.br { bottom: 20px; right: 20px; transform: scale(-1, -1); animation-delay: 4.5s; }

        .mini-flowers {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            opacity: 0.08;
            font-size: 30px;
        }
        .mf1 { top: 15%; left: 8%; animation: floatUp 8s ease-in-out infinite; }
        .mf2 { top: 70%; right: 10%; animation: floatUp 10s ease-in-out infinite 2s; }
        .mf3 { bottom: 25%; left: 15%; animation: floatUp 9s ease-in-out infinite 4s; }
        .mf4 { top: 30%; right: 18%; animation: floatUp 7s ease-in-out infinite 1s; }
        .mf5 { bottom: 15%; right: 25%; animation: floatUp 11s ease-in-out infinite 3s; }
        .mf6 { top: 50%; left: 5%; animation: floatUp 8s ease-in-out infinite 5s; }

        @keyframes sway {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(3deg); }
            75% { transform: rotate(-3deg); }
        }

        .flower-corner.tr { animation-name: sway-reverse; }
        @keyframes sway-reverse {
            0%, 100% { transform: scaleX(-1) rotate(0deg); }
            25% { transform: scaleX(-1) rotate(3deg); }
            75% { transform: scaleX(-1) rotate(-3deg); }
        }

        @keyframes floatUp {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        /* === ОСНОВНАЯ КАРТОЧКА === */
        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 50px 40px;
            width: 420px;
            max-width: 90vw;
            text-align: center;
            position: relative;
            z-index: 10;
            box-shadow: 
                0 4px 6px rgba(0, 0, 0, 0.02),
                0 12px 28px rgba(0, 0, 0, 0.06),
                0 0 0 1px rgba(0, 0, 0, 0.03);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .shield-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #f0fdf4, #dcfce7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 28px;
            border: 2px solid #bbf7d0;
        }

        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #f8fafc, #f1f5f9);
            color: #64748b;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 36px;
            font-weight: 400;
            line-height: 1.5;
        }

        /* === КНОПКИ === */
        .buttons-area {
            position: relative;
            width: 100%;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .btn {
            padding: 14px 40px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            position: relative;
            letter-spacing: 0.3px;
            touch-action: manipulation; /* Быстрые клики на мобилке */
        }

        .btn-yes {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            box-shadow: 0 4px 14px rgba(34, 197, 94, 0.35);
        }

        .btn-yes:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.45);
        }

        .btn-no {
            background: #ffffff;
            color: #ef4444;
            border: 2px solid #fecaca;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.1);
            position: absolute;
            z-index: 20;
            /* Отключаем все стандартные поведения телефона для этой кнопки */
            touch-action: none;
            pointer-events: auto;
        }

        /* === ЭКРАН УСПЕХА === */
        .success-screen {
            display: none;
            animation: successPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .success-screen.show {
            display: block;
        }

        .main-screen.hide {
            display: none;
        }

        @keyframes successPop {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 40px;
            box-shadow: 0 8px 30px rgba(34, 197, 94, 0.3);
            animation: pulse-green 2s ease-in-out infinite;
        }

        @keyframes pulse-green {
            0%, 100% { box-shadow: 0 8px 30px rgba(34, 197, 94, 0.3); }
            50% { box-shadow: 0 8px 50px rgba(34, 197, 94, 0.5); }
        }

        .success-title {
            font-size: 24px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .success-text {
            font-size: 14px;
            color: #64748b;
            line-height: 1.6;
        }

        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: confetti-fall linear forwards;
        }

        @keyframes confetti-fall {
            to {
                top: 110vh;
                transform: rotate(720deg);
            }
        }

        .attempts {
            margin-top: 20px;
            font-size: 12px;
            color: #cbd5e1;
            font-weight: 500;
            min-height: 18px;
            transition: all 0.3s;
        }

        .dots-decoration {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 24px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #e2e8f0;
        }

        .dot:nth-child(2) { background: #bbf7d0; }
        .dot:nth-child(3) { background: #22c55e; }
        .dot:nth-child(4) { background: #bbf7d0; }
        .dot:nth-child(5) { background: #e2e8f0; }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(34, 197, 94, 0.03) 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(244, 114, 182, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body>

    <!-- Цветочки по углам -->
    <div class="flower-corner tl">🌸🌿</div>
    <div class="flower-corner tr">🌺🍃</div>
    <div class="flower-corner bl">🌷🌱</div>
    <div class="flower-corner br">🌼🌿</div>

    <!-- Мелкие плавающие цветочки -->
    <div class="mini-flowers mf1">🌸</div>
    <div class="mini-flowers mf2">🌺</div>
    <div class="mini-flowers mf3">🌷</div>
    <div class="mini-flowers mf4">💮</div>
    <div class="mini-flowers mf5">🌼</div>
    <div class="mini-flowers mf6">🏵️</div>

    <!-- Контейнер для конфетти -->
    <div class="confetti-container" id="confettiContainer"></div>

    <!-- Основная карточка -->
    <div class="card" id="card">
        
        <!-- Главный экран -->
        <div class="main-screen" id="mainScreen">
            <div class="shield-icon">🛡️</div>
            <div class="badge">Проверка безопасности</div>
            
            <div class="dots-decoration">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <h1>Скинешь сиськи? 👀</h1>
            <p class="subtitle">Подтвердите, что вы не робот.<br>Выберите один из вариантов ответа.</p>

            <div class="buttons-area" id="buttonsArea">
                <button class="btn btn-yes" id="btnYes">Да ✅</button>
                <button class="btn btn-no" id="btnNo">Нет ❌</button>
            </div>

            <div class="attempts" id="attempts"></div>
        </div>

        <!-- Экран успеха -->
        <div class="success-screen" id="successScreen">
            <div class="success-icon">✓</div>
            <div class="badge" style="background: linear-gradient(135deg, #f0fdf4, #dcfce7); color: #16a34a; border-color: #bbf7d0;">Успешно</div>
            <h2 class="success-title">Подтверждение пройдено! 🎉</h2>
            <p class="success-text">
                Вы успешно доказали, что вы не робот.<br>
                Добро пожаловать, человек! 💚
            </p>
            <div class="dots-decoration" style="margin-top: 24px;">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

    </div>

    <script>
        const btnNo = document.getElementById('btnNo');
        const btnYes = document.getElementById('btnYes');
        const card = document.getElementById('card');
        const attemptsEl = document.getElementById('attempts');
        
        let attempts = 0;

        // Фразы при попытках нажать "Нет"
        const phrases = [
            "Не-а 😏",
            "Мимо!",
            "Попробуй ещё раз 😄",
            "Ты точно не робот?",
            "Кнопка быстрее тебя ⚡",
            "Даже не пытайся 😂",
            "Робот бы уже сдался",
            "Ну куда ты жмёшь? 🤭",
            "Она от тебя убегает!",
            "Сдавайся уже 💀",
            "Бесконечность не предел ♾️",
            "Ладно, жми Да уже...",
            "Ты упорный, уважаю 😅",
            "Но кнопка упорнее!",
            "Это бесполезно 🫠"
        ];

        // Блокируем ВСЁ стандартное поведение браузера на телефоне
        document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
        document.addEventListener('contextmenu', (e) => e.preventDefault());

        function moveButton(e) {
            // Останавливаем любое стандартное событие (тап, клик, выделение)
            e.preventDefault();
            e.stopPropagation();
            
            const btnRect = btnNo.getBoundingClientRect();
            const maxX = window.innerWidth - btnRect.width - 20;
            const maxY = window.innerHeight - btnRect.height - 20;
            
            let newX, newY;
            const cardRect = card.getBoundingClientRect();
            
            do {
                newX = Math.random() * maxX + 10;
                newY = Math.random() * maxY + 10;
            } while (
                Math.abs(newX - (cardRect.left + cardRect.width/2)) < 100 && 
                Math.abs(newY - (cardRect.top + cardRect.height/2)) < 80
            );

            btnNo.style.position = 'fixed';
            btnNo.style.left = newX + 'px';
            btnNo.style.top = newY + 'px';
            btnNo.style.transition = 'all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1)';
            
            const rotation = (Math.random() - 0.5) * 30;
            btnNo.style.transform = `rotate(${rotation}deg)`;

            attempts++;
            
            const phrase = phrases[Math.min(attempts - 1, phrases.length - 1)];
            attemptsEl.textContent = `${phrase} (попытка #${attempts})`;
            attemptsEl.style.color = '#f87171';
            
            setTimeout(() => {
                if (attemptsEl.textContent.includes(`#${attempts}`)) {
                    attemptsEl.style.color = '#cbd5e1';
                }
            }, 1500);
        }

        // === ГЛАВНОЕ ИСПРАВЛЕНИЕ ДЛЯ ТЕЛЕФОНА ===
        // Используем ТОЛЬКО touchstart. Он срабатывает мгновенно при касании пальцем,
        // раньше чем телефон успеет показать анимацию нажатия или зарегистрировать клик.
        btnNo.addEventListener('touchstart', moveButton, { passive: false });
        
        // Для компьютеров оставляем mousedown (срабатывает раньше click)
        btnNo.addEventListener('mousedown', moveButton);

        // Полностью блокируем любые попытки кликнуть кнопку "Нет"
        btnNo.addEventListener('click', (e) => e.preventDefault());

        // Нажатие "Да"
        btnYes.addEventListener('click', sayYes);
        btnYes.addEventListener('touchend', (e) => {
            e.preventDefault();
            sayYes();
        });

        function sayYes() {
            const mainScreen = document.getElementById('mainScreen');
            const successScreen = document.getElementById('successScreen');
            
            btnNo.style.display = 'none';
            
            mainScreen.classList.add('hide');
            successScreen.classList.add('show');
            
            launchConfetti();
        }

        // Конфетти эффект
        function launchConfetti() {
            const container = document.getElementById('confettiContainer');
            const colors = ['#22c55e', '#16a34a', '#f472b6', '#fb923c', '#a78bfa', '#38bdf8', '#fbbf24', '#f87171'];
            const shapes = ['circle', 'square'];
            
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const shape = shapes[Math.floor(Math.random() * shapes.length)];
                    const size = Math.random() * 8 + 6;
                    const left = Math.random() * 100;
                    const duration = Math.random() * 2 + 2;
                    const delay = Math.random() * 0.5;
                    
                    confetti.style.left = left + 'vw';
                    confetti.style.width = size + 'px';
                    confetti.style.height = size + 'px';
                    confetti.style.background = color;
                    confetti.style.borderRadius = shape === 'circle' ? '50%' : '2px';
                    confetti.style.animationDuration = duration + 's';
                    confetti.style.animationDelay = delay + 's';
                    confetti.style.opacity = Math.random() * 0.7 + 0.3;
                    
                    container.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), (duration + delay) * 1000 + 500);
                }, i * 30);
            }
        }
    </script>
</body>
</html>
